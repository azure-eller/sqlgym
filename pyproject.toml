[project]
name = "sqlgym"
version = "0.1.0"
description = "Practice SQL interview problems from the terminal"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Azure Eller", email = "azureller1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "rich>=15.0.0",
]

[project.scripts]
sqlgym = "sqlgym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the repo-root problems/ directory inside the installed package.
[tool.hatch.build.targets.wheel.force-include]
"problems" = "sqlgym/problems"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
